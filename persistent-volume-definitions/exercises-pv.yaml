apiVersion: v1
kind: PersistentVolume
metadata:
  name: exercises-pv
spec:
  storageClassName: k8s-exercises-pv # this is the name you are using later to claim this volume
  capacity:
    storage: 500Mi
  volumeMode: Filesystem # This declares that it will be mounted into pods as a directory
  accessModes:
  - ReadWriteOnce
  local:
    path: /tmp/kube
  nodeAffinity: ## This is only required for local, it defines which nodes can access it
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k3d-mycluster-agent-0
