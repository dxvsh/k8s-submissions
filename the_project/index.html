<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Todo App</title></head>
	<style>
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			background: #f5f7fb;
			color: #1f2937;
		}

		main {
			max-width: 900px;
			margin: 48px auto;
			padding: 0 20px;
			text-align: center;
		}

		h1 {
			margin-bottom: 12px;
			font-size: 2.5rem;
		}

		p {
			margin-bottom: 28px;
			color: #4b5563;
		}

		.hero-image {
			width: 100%;
			max-width: 720px;
			border-radius: 18px;
			box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
			object-fit: cover;
		}
	</style>
</head>
<body>
	<main>
		<h1>Todo App</h1>
		<p>A simple todo app page for learning Kubernetes deployments.</p>
		<img class="hero-image" src="/image" alt="Random image from Lorem Picsum">
	</main>
</body>
</html>
