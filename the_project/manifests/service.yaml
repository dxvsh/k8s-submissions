apiVersion: v1
kind: Service
metadata:
  name: project-app-svc
spec:
  type: NodePort
  selector:
    app: project-app # This is the app as declared in the deployment.
  ports:
    - name: http
      nodePort: 30080 # This is the port that is available outside. Value for nodePort can be between 30000-32767
      protocol: TCP
      port: 1234
      targetPort: 9090
