apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      volumes:
        - name: pingpong-vol
          persistentVolumeClaim:
            claimName: pingpong-claim
      containers:
        - name: pingpong
          image: ping_pong:1.11
          volumeMounts:
            - name: pingpong-vol
              mountPath: /usr/src/app/logs
